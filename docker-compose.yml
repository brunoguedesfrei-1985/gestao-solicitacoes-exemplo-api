version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-solicitacoes-api
    ports:
      - "8090:8090"
    environment:
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=postgres123
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/gestao
      - QUARKUS_LOG_LEVEL=INFO
      - JWT_SECRET=ut0SjtniXwOuhMbPt4CjlonfR67VyTFZ
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestao-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: gestao-postgres
    environment:
      - POSTGRES_DB=gestao
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gestao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gestao-network:
    driver: bridge